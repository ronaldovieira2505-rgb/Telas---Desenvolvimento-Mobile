<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tela_12 — Entrar</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>

<div class="screen screen--focus">

  <header class="header">
    <a class="header__back" href="tela_01.html">&lt;</a>
    <h1 class="header__title">Entrar</h1>
  </header>

  <main class="screen__content">

    <h2 class="screen__title">Acesse sua conta</h2>
    <p class="screen__subtitle">Candidate-se aos turnos e acompanhe seus pagamentos.</p>

    <form class="form form--login">

      <div class="form__group">
        <label class="form__label" for="login-email">E-mail</label>
        <input class="form__input" type="email" id="login-email" placeholder="seu@email.com">
      </div>

      <div class="form__group">
        <label class="form__label" for="login-senha">Senha</label>
        <input class="form__input" type="password" id="login-senha" placeholder="••••••••">
        <p class="form__hint">Esqueceu a senha?</p>
      </div>

      <div class="form__actions">
        <a class="button button--primary button--block" href="tela_14.html">Entrar</a>
        <button class="button button--secondary button--block">Entrar com Google</button>
      </div>

      <p class="form__footer">
        Ainda não tem conta?
        <a class="section__link" href="tela_13.html">Criar conta</a>
      </p>

    </form>

  </main>

  <nav class="nav nav--tabs">
    <a class="nav__item" href="tela_01.html">Início</a>
    <a class="nav__item" href="tela_11.html">Buscar</a>
    <a class="nav__item" href="tela_04.html">Alertas</a>
    <a class="nav__item nav__item--active" href="tela_12.html">Perfil</a>
  </nav>

</div>

</body>
</html>
